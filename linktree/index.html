<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Charles Kremer — Liens</title>
  <meta name="description" content="Charles Kremer — Communication & influence. Retrouvez mes liens : LinkedIn, Instagram, CV, PM – Politique Médiatique et Divertere.">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="icon" type="image/jpeg" href="./profil.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --border: #e1e6ee;
      --text: #0f1b2d;
      --muted: #5b6778;
      --primary: #0b1f3a;
      --primary-hover: #152f55;
      --on-primary: #ffffff;
      --accent: #b8975a;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15,27,45,0.04), 0 4px 16px rgba(15,27,45,0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0f18;
        --surface: #121a26;
        --border: #223043;
        --text: #e8edf4;
        --muted: #93a0b3;
        --primary: #e8edf4;
        --primary-hover: #ffffff;
        --on-primary: #0b1f3a;
        --accent: #c9aa6c;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      }
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 16px calc(32px + env(safe-area-inset-bottom));
    }

    /* ── EN-TÊTE ── */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 16px;
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border), var(--shadow);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .role {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .rule {
      width: 32px;
      height: 2px;
      background: var(--accent);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    /* ── BOUTONS ── */
    a { color: inherit; text-decoration: none; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--muted); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

    /* 3 boutons du haut */
    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }
    .top-actions .btn-cv { grid-column: 1 / -1; }

    /* ── SECTIONS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-head { margin-bottom: 14px; }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .btn-site {
      min-height: 60px;
      font-size: 1rem;
      justify-content: space-between;
      padding: 14px 18px;
    }
    .btn-site .label { display: flex; align-items: center; gap: 10px; }

    .socials {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .socials .btn {
      min-height: 48px;
      padding: 10px 0;
    }
    .socials .btn svg { width: 22px; height: 22px; }

    .btn-small {
      margin-top: 10px;
      min-height: 44px;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .btn-small svg { width: 18px; height: 18px; }

    /* Liens supplémentaires */
    .links { display: grid; gap: 10px; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 28px;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    @media (min-width: 640px) {
      .page { padding-top: 64px; }
    }
  </style>
</head>
<body>
